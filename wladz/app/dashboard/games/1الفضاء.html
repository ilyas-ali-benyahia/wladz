<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a1f">
<title>الرائد الصغير — رحلة إلى الفضاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --midnight:#050a1f;
  --deep:#0a1236;
  --indigo:#161d4d;
  --violet:#3a2a6b;
  --gold:#ffc857;
  --gold-deep:#ff9f1c;
  --cyan:#4fe3d0;
  --turquoise:#25c9c0;
  --coral:#ff7b6b;
  --white:#f4f8ff;
  --muted:#a9b8dd;
  --panel:rgba(10,18,54,.86);
  --panel-soft:rgba(22,29,77,.72);
  --stroke:rgba(120,180,255,.22);
  --radius:24px;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --font:'Baloo Bhaijaan 2', system-ui, 'Segoe UI', Tahoma, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--midnight);
  color:var(--white);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:14px}
.hidden{display:none !important}

#app{position:fixed;inset:0;overflow:hidden}

/* ============================================================
   3D CANVAS
   ============================================================ */
#space{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  background:radial-gradient(ellipse at 50% 45%, #0d1638 0%, #060b20 45%, #02040d 100%);
  z-index:1;
}

/* ============================================================
   SCENE A — THE MAGICAL OBSERVATORY
   ============================================================ */
#observatory{
  position:absolute;inset:0;z-index:2;
  clip-path:circle(160% at 50% 62%);
  transition:clip-path 1.5s cubic-bezier(.72,0,.28,1), opacity .5s ease 1.2s;
  background:
    radial-gradient(ellipse 120% 80% at 50% 0%, #1a2358 0%, #0c1233 42%, #05081c 100%);
  overflow:hidden;
}
#observatory.iris-out{clip-path:circle(0% at 50% 62%);opacity:0;pointer-events:none}

/* --- window with stars --- */
.obs-window{
  position:absolute;top:4%;left:50%;transform:translateX(-50%);
  width:min(74vw,720px);height:46%;
  border-radius:60px 60px 26px 26px;
  background:linear-gradient(180deg,#03061a 0%,#0a1030 60%,#101a45 100%);
  border:6px solid rgba(90,130,220,.28);
  box-shadow:inset 0 0 90px rgba(60,120,255,.22), 0 0 70px rgba(60,120,255,.12);
  overflow:hidden;
}
.obs-window::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 25%, rgba(120,180,255,.10), transparent 55%);
  pointer-events:none;
}
.moon-orb{
  position:absolute;top:16%;left:16%;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%, #fdfaf0, #cfd6e6 60%, #8e97b5 100%);
  box-shadow:0 0 40px rgba(220,235,255,.45);
  animation:moonDrift 26s ease-in-out infinite alternate;
}
@keyframes moonDrift{from{transform:translate(0,0)}to{transform:translate(40px,-16px)}}

.star-dot{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

/* --- floor --- */
.obs-floor{
  position:absolute;bottom:0;left:0;right:0;height:34%;
  background:linear-gradient(180deg, rgba(20,28,66,.0) 0%, #131a44 32%, #0a0f2b 100%);
}
.obs-floor::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, rgba(90,140,255,.06) 0 2px, transparent 2px 84px);
  mask-image:linear-gradient(180deg,transparent,#000 60%);
}

/* --- scene row: astronaut + telescope --- */
.obs-scene{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(4px,3vw,60px);
  padding-bottom:clamp(150px,26vh,260px);
}
.telescope{width:clamp(110px,17vw,200px);height:auto;filter:drop-shadow(0 22px 34px rgba(0,0,0,.6))}
.astronaut{width:clamp(100px,15vw,180px);height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}

#lensGlow{transition:opacity .6s ease}
.obs-armed #lensGlow{opacity:1 !important}
.obs-armed #tubeGroup{animation:tubeNudge 1.6s ease-in-out infinite}
@keyframes tubeNudge{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(-32deg)}}

/* --- astronaut animation --- */
.astro-float{animation:astroFloat 3.8s ease-in-out infinite}
@keyframes astroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.astro-wave{transform-origin:80% 20%;animation:waveArm 2.6s ease-in-out infinite}
@keyframes waveArm{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-26deg)}90%{transform:rotate(6deg)}}
.astro-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* --- welcome copy + start --- */
.obs-ui{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:0 20px calc(22px + env(safe-area-inset-bottom));
  text-align:center;
}
.obs-title{
  margin:0;font-size:clamp(26px,5vw,48px);font-weight:800;letter-spacing:.5px;
  background:linear-gradient(100deg,#fff 10%,var(--gold) 45%,var(--cyan) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 42px rgba(255,200,87,.28);
}
.obs-sub{
  margin:0;max-width:640px;font-size:clamp(15px,2.4vw,20px);line-height:1.7;
  color:#cddcff;font-weight:500;
}
.obs-bubble{
  position:relative;max-width:min(88vw,620px);
  background:var(--panel-soft);border:1.5px solid var(--stroke);
  border-radius:22px;padding:14px 20px;backdrop-filter:blur(14px);
  font-size:clamp(15px,2.3vw,19px);line-height:1.65;color:#e8f0ff;
  box-shadow:var(--shadow);
}
.obs-bubble::after{
  content:'';position:absolute;bottom:-9px;right:48px;width:16px;height:16px;
  background:var(--panel-soft);border-left:1.5px solid var(--stroke);border-bottom:1.5px solid var(--stroke);
  transform:rotate(-45deg);backdrop-filter:blur(14px);
}

.btn-primary{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;gap:12px;
  padding:18px 42px;border-radius:999px;
  font-size:clamp(18px,2.6vw,24px);font-weight:800;color:#20160a;
  background:linear-gradient(120deg,#ffe08a,#ffc857 40%,#ff9f1c);
  box-shadow:0 12px 34px rgba(255,159,28,.42), inset 0 -4px 0 rgba(160,90,0,.28);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
}
.btn-primary:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 18px 44px rgba(255,159,28,.55), inset 0 -4px 0 rgba(160,90,0,.28)}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-primary::before{
  content:'';position:absolute;top:0;bottom:0;width:44px;left:-70px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite;
}
@keyframes sheen{0%,70%{left:-70px}100%{left:130%}}
.pulse-ring{
  position:absolute;inset:-8px;border-radius:999px;border:2px solid rgba(255,200,87,.6);
  animation:pulseRing 2.4s ease-out infinite;pointer-events:none;
}
@keyframes pulseRing{0%{transform:scale(.94);opacity:.85}100%{transform:scale(1.18);opacity:0}}

/* ============================================================
   HUD
   ============================================================ */
#hud{position:absolute;inset:0;z-index:5;pointer-events:none}
.hud-top{
  position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;pointer-events:auto;
}
.hud-chip{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--panel);border:1.5px solid var(--stroke);border-radius:999px;
  padding:9px 18px;font-size:clamp(14px,2vw,18px);font-weight:700;
  backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.hud-chip .ico{font-size:1.15em;line-height:1}
#pointsVal{color:var(--gold)}
#discVal{color:var(--cyan)}
.hud-spacer{flex:1}
.icon-btn{
  width:clamp(44px,6vw,52px);height:clamp(44px,6vw,52px);
  display:grid;place-items:center;font-size:clamp(19px,2.6vw,23px);
  background:var(--panel);border:1.5px solid var(--stroke);border-radius:16px;
  backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s;
}
.icon-btn:hover{transform:translateY(-3px) scale(1.06);background:rgba(35,55,120,.9);border-color:rgba(120,200,255,.5)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.off{opacity:.45}

.hud-bottom{
  position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  pointer-events:none;
}
.hud-hint{
  background:rgba(10,18,54,.72);border:1.5px solid var(--stroke);
  border-radius:999px;padding:10px 24px;font-size:clamp(13px,1.9vw,16px);
  color:#c3d4ff;backdrop-filter:blur(12px);white-space:nowrap;
  animation:hintFloat 4s ease-in-out infinite;
}
@keyframes hintFloat{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-5px);opacity:1}}

/* hover tip */
#hoverTip{
  position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-140%);
  background:linear-gradient(120deg, rgba(79,227,208,.96), rgba(37,201,192,.96));
  color:#04211f;font-weight:700;font-size:14px;padding:9px 18px;border-radius:14px;
  box-shadow:0 10px 28px rgba(37,201,192,.4);white-space:nowrap;
  transition:opacity .16s ease;
}

/* ============================================================
   PANELS / MODALS
   ============================================================ */
.overlay{
  position:absolute;inset:0;z-index:20;
  display:grid;place-items:center;padding:20px;
  background:rgba(3,6,20,.78);backdrop-filter:blur(10px);
  animation:fadeIn .28s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.panel{
  background:linear-gradient(160deg, rgba(26,36,88,.97), rgba(10,16,44,.98));
  border:1.5px solid var(--stroke);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:clamp(20px,3.4vw,34px);
  max-width:min(94vw,660px);width:100%;max-height:92vh;overflow-y:auto;
  animation:panelIn .38s cubic-bezier(.2,1.2,.4,1);
}
@keyframes panelIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

/* question panel */
#questionPanel{
  position:absolute;z-index:12;
  bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:min(94vw,720px);pointer-events:auto;
}
@media(min-width:1000px){
  #questionPanel{left:auto;right:32px;bottom:auto;top:50%;transform:translateY(-50%);width:min(430px,34vw)}
}
.q-obj{
  display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(15px,2.1vw,18px);
  color:var(--gold);background:rgba(255,200,87,.12);border:1.5px solid rgba(255,200,87,.3);
  border-radius:999px;padding:6px 16px;margin-bottom:14px;
}
.q-text{
  font-size:clamp(18px,2.9vw,24px);font-weight:700;line-height:1.7;margin:0 0 20px;
  color:#fff;
}
.q-options{display:flex;flex-direction:column;gap:12px}
.opt-btn{
  display:flex;align-items:center;gap:14px;width:100%;text-align:right;
  padding:17px 22px;border-radius:18px;
  background:rgba(255,255,255,.055);border:2px solid rgba(140,180,255,.22);
  font-size:clamp(16px,2.4vw,20px);font-weight:700;color:#e9f1ff;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s;
}
.opt-btn:hover{background:rgba(79,227,208,.14);border-color:var(--cyan);transform:translateX(-6px)}
.opt-btn:active{transform:scale(.98)}
.opt-btn .opt-letter{
  flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:rgba(79,227,208,.16);color:var(--cyan);font-weight:800;font-size:17px;
}
.opt-btn.correct{background:rgba(80,230,140,.22);border-color:#4ade80;animation:popCorrect .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popCorrect{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
.opt-btn.wrong{background:rgba(255,123,107,.16);border-color:var(--coral);animation:shakeX .45s ease}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(9px)}40%{transform:translateX(-9px)}60%{transform:translateX(6px)}80%{transform:translateX(-4px)}}
.opt-btn.reveal{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,87,.25);animation:revealPulse 1.1s ease-in-out infinite}
@keyframes revealPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,200,87,.22)}50%{box-shadow:0 0 0 8px rgba(255,200,87,.06)}}
.opt-btn[disabled]{cursor:default}

.q-footer{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-ghost{
  padding:12px 22px;border-radius:14px;font-weight:700;font-size:clamp(14px,2vw,17px);
  background:rgba(255,255,255,.06);border:1.5px solid rgba(140,180,255,.22);color:#cfe0ff;
  transition:background .2s, transform .16s;
}
.btn-ghost:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.btn-ghost.gold{background:rgba(255,200,87,.16);border-color:rgba(255,200,87,.45);color:var(--gold)}
.q-feedback{
  margin-top:16px;padding:14px 18px;border-radius:16px;font-size:clamp(15px,2.2vw,18px);
  line-height:1.6;font-weight:600;animation:panelIn .3s ease;
}
.q-feedback.good{background:rgba(74,222,128,.14);border:1.5px solid rgba(74,222,128,.4);color:#bbf7d0}
.q-feedback.bad{background:rgba(255,200,87,.12);border:1.5px solid rgba(255,200,87,.35);color:#fde9b8}

/* ============================================================
   DISCOVERY CARD
   ============================================================ */
.card{
  display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
}
.card-visual{
  position:relative;width:clamp(150px,26vw,210px);height:clamp(150px,26vw,210px);
  display:grid;place-items:center;
}
.card-visual canvas{
  width:100%;height:100%;border-radius:50%;
  filter:drop-shadow(0 0 34px rgba(90,160,255,.5));
}
.card-visual::after{
  content:'';position:absolute;inset:-16%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(120,200,255,.22), transparent 65%);
  animation:haloPulse 3s ease-in-out infinite;
}
@keyframes haloPulse{0%,100%{transform:scale(.94);opacity:.55}50%{transform:scale(1.06);opacity:.95}}
.card-name{
  font-size:clamp(28px,5vw,42px);font-weight:800;margin:0;
  background:linear-gradient(100deg,#fff,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.card-desc{font-size:clamp(15px,2.3vw,19px);line-height:1.75;color:#d5e2ff;margin:0;max-width:520px}
.card-facts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:540px}
.fact{
  display:flex;gap:12px;align-items:flex-start;text-align:right;
  background:rgba(79,227,208,.09);border:1.5px solid rgba(79,227,208,.24);
  border-radius:16px;padding:13px 18px;font-size:clamp(14px,2.1vw,17px);line-height:1.6;color:#d9f6f2;
  animation:panelIn .4s ease backwards;
}
.fact:nth-child(2){animation-delay:.1s}
.fact:nth-child(3){animation-delay:.2s}
.fact .fico{flex:none;font-size:1.2em}
.card-reward{
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(255,200,87,.14);border:1.5px solid rgba(255,200,87,.4);
  border-radius:999px;padding:9px 22px;font-weight:800;color:var(--gold);
  font-size:clamp(15px,2.2vw,19px);
}
.card-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ============================================================
   COLLECTION
   ============================================================ */
.coll-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:14px;margin-top:18px;
}
.coll-item{
  background:rgba(255,255,255,.05);border:1.5px solid rgba(140,180,255,.2);
  border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;
  align-items:center;gap:8px;transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .2s;
}
.coll-item.got{border-color:rgba(79,227,208,.42);background:rgba(79,227,208,.07)}
.coll-item.got:hover{transform:translateY(-5px) scale(1.03);border-color:var(--cyan)}
.coll-item canvas{width:84px;height:84px;border-radius:50%}
.coll-item.locked canvas{
  display:grid;place-items:center;background:rgba(0,0,0,.42);border-radius:50%;
}
.coll-lock{
  width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, #1b2452, #0a0f2a);
  border:2px dashed rgba(140,180,255,.25);font-size:30px;color:#3d4b7d;
}
.coll-name{font-weight:700;font-size:15px;color:#e2ecff}
.coll-item.locked .coll-name{color:#5b6a99}
.coll-item .mini{font-size:12px;color:var(--gold);font-weight:700}

/* badges */
.badges{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.badge{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  width:104px;padding:13px 8px;border-radius:18px;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(140,180,255,.18);
  transition:transform .18s;
}
.badge.on{background:linear-gradient(160deg, rgba(255,200,87,.2), rgba(255,159,28,.08));border-color:rgba(255,200,87,.55);animation:badgeIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes badgeIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.badge .bico{font-size:30px;filter:grayscale(1);opacity:.35}
.badge.on .bico{filter:none;opacity:1;animation:badgeGlow 2.4s ease-in-out infinite}
@keyframes badgeGlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.badge .bname{font-size:12.5px;font-weight:700;text-align:center;color:#93a4d0;line-height:1.35}
.badge.on .bname{color:var(--gold)}

/* progress bar */
.prog-wrap{margin-top:16px}
.prog-label{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#a9b8dd;margin-bottom:8px}
.prog-track{height:14px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(140,180,255,.18)}
.prog-fill{
  height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg, var(--turquoise), var(--cyan), var(--gold));
  transition:width .8s cubic-bezier(.2,1,.3,1);
  box-shadow:0 0 18px rgba(79,227,208,.55);
}

/* mission complete */
#completeOverlay .panel{
  background:linear-gradient(160deg, rgba(40,30,90,.97), rgba(10,16,44,.98));
  text-align:center;border-color:rgba(255,200,87,.35);
}
.complete-emoji{font-size:clamp(52px,9vw,86px);animation:badgeGlow 2.2s ease-in-out infinite}
.stat-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.stat{
  background:rgba(255,255,255,.06);border:1.5px solid rgba(140,180,255,.2);
  border-radius:18px;padding:14px 26px;min-width:118px;
}
.stat .sval{font-size:clamp(24px,4vw,34px);font-weight:800;color:var(--gold);line-height:1.15}
.stat .slbl{font-size:13px;color:#a9b8dd;font-weight:700}

/* toast */
#toast{
  position:absolute;top:calc(88px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:30;pointer-events:none;
  background:linear-gradient(120deg, rgba(255,200,87,.96), rgba(255,159,28,.96));
  color:#2a1a02;font-weight:800;font-size:clamp(15px,2.2vw,19px);
  padding:13px 30px;border-radius:999px;box-shadow:0 14px 40px rgba(255,159,28,.45);
  opacity:0;transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(6px) scale(1.04)}

/* tutorial */
.tut-step{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;text-align:right}
.tut-num{
  flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;

    return { ...structuredClone(DEFAULT_STATE), ...parsed };
  } catch { return structuredClone(DEFAULT_STATE); }
}
function saveState(){

/* ============================================================
   3. SOUND — procedural Web Audio
   ============================================================ */
const Sound = (() => {
  let ctx = null, master = null, padGain = null, started = false;
  let enabled = state.sound;

  function ensure(){
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = enabled ? 0.85 : 0;
    master.connect(ctx.destination);
    return ctx;
  }
  function resume(){ const c = ensure(); if (c && c.state === 'suspended') c.resume(); }

  function tone(freq, dur, opt = {}){
    if (!ctx || !enabled) return;
    const { type = 'sine', gain = 0.14, delay = 0, attack = 0.012, glide = null } = opt;
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(20, glide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }

  function noise(dur, opt = {}){
    if (!ctx || !enabled) return;
    const { gain = 0.1, delay = 0, from = 200, to = 2400 } = opt;
    const t0 = ctx.currentTime + delay;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const flt = ctx.createBiquadFilter(); flt.type = 'bandpass'; flt.Q.value = 1.1;
    flt.frequency.setValueAtTime(from, t0);
    flt.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur);
  }

  let padNodes = [];
  function startAmbient(){
    if (!ctx || started) return;
    started = true;
    padGain = ctx.createGain();
    padGain.gain.value = 0;
    padGain.connect(master);
    const flt = ctx.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 620; flt.Q.value = 0.7;
    flt.connect(padGain);

    [55, 82.5, 110, 164.8].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i % 2 ? 'triangle' : 'sine';
      o.frequency.value = f * (1 + (i - 1.5) * 0.0018);
      const g = ctx.createGain();
      g.gain.value = 0.16 / (i + 1);
      o.connect(g); g.connect(flt);
      o.start();
      padNodes.push(o);
    });

    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.045;
    const lfoG = ctx.createGain(); lfoG.gain.value = 220;
    lfo.connect(lfoG); lfoG.connect(flt.frequency); lfo.start();
    padNodes.push(lfo);

    padGain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 4);

    const sparkle = () => {
      if (!enabled) { setTimeout(sparkle, 4000); return; }
      const notes = [523.25, 659.25, 783.99, 1046.5, 880];
      tone(pick(notes), 1.5, { type:'sine', gain:0.035 });
      setTimeout(sparkle, rand(5000, 11000));
    };
    setTimeout(sparkle, 3500);
  }

  return {
    resume, ensure,
    get enabled(){ return enabled; },
    setEnabled(v){
      enabled = v;
      state.sound = v; saveState();
      if (master) master.gain.setTargetAtTime(v ? 0.85 : 0, ctx.currentTime, 0.05);
      if (v) { resume(); startAmbient(); }
    },
    startAmbient,
    click(){ tone(660, 0.09, { type:'triangle', gain:0.09 }); },
    hover(){ tone(880, 0.05, { type:'sine', gain:0.03 }); },
    whoosh(){ noise(1.5, { gain:0.16, from:180, to:2600 }); tone(160, 1.4, { type:'sine', gain:0.07, glide:60 }); },
    correct(){
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
        tone(f, 0.55, { type:'triangle', gain:0.13, delay: i * 0.09 }));
      tone(1567.98, 0.9, { type:'sine', gain:0.07, delay:0.36 });
    },
    wrong(){
      tone(392, 0.28, { type:'sine', gain:0.10 });
      tone(311.13, 0.36, { type:'sine', gain:0.09, delay:0.16 });
    },
    discover(){
      noise(0.7, { gain:0.07, from:900, to:3200 });
      [784, 988, 1319].forEach((f, i) => tone(f, 0.7, { type:'sine', gain:0.08, delay:i * 0.07 }));
    },
    badge(){ [659, 880, 1175, 1568].forEach((f,i)=> tone(f, 0.5, { type:'triangle', gain:0.10, delay:i*0.08 })); },
    fanfare(){
      const seq = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
      seq.forEach((f, i) => tone(f, 0.6, { type:'triangle', gain:0.13, delay: i * 0.17 }));
      seq.forEach((f, i) => tone(f / 2, 0.6, { type:'sine', gain:0.08, delay: i * 0.17 }));
      noise(2.2, { gain:0.05, from:600, to:4200 });
    }
  };
})();

function hexToRgb(h){ h = h.replace('#',''); return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) }; }
function mixRgb(a,b,t){ return { r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t }; }
function rgbStr(c){ return `rgb(${c.r|0},${c.g|0},${c.b|0})`; }

const TEX_W = 768, TEX_H = 384;

function makeTexture(draw, w = TEX_W, h = TEX_H){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 4;
  texture.wrapS = THREE.RepeatWrapping;
  return { texture, canvas: c };
}

function bandedTexture(palette, opts = {}){
  const rgbPal = palette.map(hexToRgb);
  return makeTexture((ctx, w, h) => {
    for (let y = 0; y < h; y++){
      const t = (y / h) * (rgbPal.length - 1);
      const i = Math.min(rgbPal.length - 2, Math.floor(t));
      ctx.fillStyle = rgbStr(mixRgb(rgbPal[i], rgbPal[i+1], t - i));
      ctx.fillRect(0, y, w, 1);
    }
    const streaks = opts.streaks ?? 200;
    for (let i = 0; i < streaks; i++){
      const y = Math.random() * h, x = Math.random() * w;
      const ww = 30 + Math.random() * 210, hh = 2 + Math.random() * 9;
      ctx.globalAlpha = 0.04 + Math.random() * 0.09;
      ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#000000';
      ctx.beginPath(); ctx.ellipse(x, y, ww, hh, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (opts.spot){
      const { x, y, rx, ry, color } = opts.spot;
      ctx.save();
      try { ctx.filter = 'blur(7px)'; } catch {}
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.ellipse(x*w, y*h, rx, ry, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.ellipse(x*w, y*h, rx*1.35, ry*1.45, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
}

function craterTexture(base, dark, light, craters){
  return makeTexture((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 420; i++){
      ctx.globalAlpha = 0.04 + Math.random() * 0.11;
      ctx.fillStyle = Math.random() > 0.5 ? light : dark;
      const x = Math.random()*w, y = Math.random()*h, r = 10 + Math.random()*72;
      ctx.beginPath(); ctx.ellipse(x, y, r, r * rand(0.55, 1.15), 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < craters; i++){
      const x = Math.random()*w, y = Math.random()*h, r = 2 + Math.random()*15;
      const g = ctx.createRadialGradient(x - r*0.35, y - r*0.35, r*0.08, x, y, r);
      g.addColorStop(0, dark);
      g.addColorStop(0.5, base);
      g.addColorStop(1, light);
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}

function earthTexture(){
  return makeTexture((ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0,   '#0e3266');
    g.addColorStop(0.35,'#175da3');
    g.addColorStop(0.65,'#1a68b4');
    g.addColorStop(1,   '#0e3266');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    const land = ['#2f7a3f','#3f8a4a','#5d8f3c','#b39a5e','#8a7a45','#35704a'];
    for (let i = 0; i < 17; i++){
      const cx = Math.random()*w, cy = h*0.14 + Math.random()*h*0.72;
      const n = 14 + Math.floor(Math.random()*20);
      for (let j = 0; j < n; j++){
        const a = Math.random()*Math.PI*2, d = Math.random()*60;
        const x = cx + Math.cos(a)*d, y = cy + Math.sin(a)*d*0.68;
        ctx.fillStyle = land[Math.floor(Math.random()*land.length)];
        ctx.globalAlpha = 0.92;
        ctx.beginPath(); ctx.ellipse(x, y, 14 + Math.random()*36, 11 + Math.random()*26, 0, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    let pg = ctx.createLinearGradient(0, 0, 0, 42);
    pg.addColorStop(0, 'rgba(240,250,255,0.98)');
    pg.addColorStop(1, 'rgba(240,250,255,0)');
    ctx.fillStyle = pg; ctx.fillRect(0, 0, w, 42);
    pg = ctx.createLinearGradient(0, h, 0, h - 42);
    pg.addColorStop(0, 'rgba(240,250,255,0.98)');
    pg.addColorStop(1, 'rgba(240,250,255,0)');
    ctx.fillStyle = pg; ctx.fillRect(0, h - 42, w, 42);
  });
}

function makeStarfield(){
  const N = 2800;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  const col = new Float32Array(N*3);
  const c = new THREE.Color();
  for (let i = 0; i < N; i++){
    const r = 430 + Math.random()*950;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random() - 1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    c.setHSL(0.55 + Math.random()*0.13, 0.35 + Math.random()*0.45, 0.72 + Math.random()*0.28);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 4.2, map: softDot(), vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true, opacity: 0.95
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);

  const N2 = 420;
  const g2 = new THREE.BufferGeometry();
  const p2 = new Float32Array(N2*3);
  for (let i = 0; i < N2; i++){
    const r = 600 + Math.random()*700;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random() - 1);
    p2[i*3]   = r*Math.sin(ph)*Math.cos(th);
    p2[i*3+1] = r*Math.cos(ph);
    p2[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  g2.setAttribute('position', new THREE.BufferAttribute(p2, 3));
  const m2 = new THREE.PointsMaterial({
    size: 9, map: softDot(), color: 0xbfe6ff, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true, opacity: 0.7
  });
  const tw = new THREE.Points(g2, m2);
  scene.add(tw);
  return { stars: pts, twinkles: tw };
}

/* ---------- shooting star ---------- */
const shooting = (() => {
  const geo = new THREE.PlaneGeometry(46, 1.1);
  const c = document.createElement('canvas'); c.width = 128; c.height = 8;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 128, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.75, 'rgba(200,235,255,0.9)');
  g.addColorStop(1, 'rgba(255,255,255,1)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 8);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.visible = false;
  scene.add(mesh);
  let timer = rand(4, 9), active = false, life = 0, dir = new THREE.Vector3();

  return {
    update(dt){
      if (REDUCED) return;
      if (!active){
        timer -= dt;
        if (timer <= 0){
          active = true; life = 0;
          mesh.visible = true;
          const start = new THREE.Vector3(rand(-500, 500), rand(120, 380), rand(-700, -250));
          mesh.position.copy(start);
          const end = new THREE.Vector3(start.x - rand(180, 380), start.y - rand(90, 200), start.z + rand(40, 160));
          dir.copy(end).sub(start).normalize();
          mesh.lookAt(end);
          mesh.rotateY(Math.PI/2);
        }
      } else {
        life += dt;
        mesh.position.addScaledVector(dir, 520 * dt);
        mesh.material.opacity = Math.sin(clamp(life / 1.5, 0, 1) * Math.PI) * 0.9;
        if (life > 1.5){ active = false; mesh.visible = false; timer = rand(7, 16); }
      }
    }
  };
})();

function createOrbitRing(radius){
  const pts = [];
  const seg = 220;
  for (let i = 0; i <= seg; i++){
    const a = (i/seg) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x5f7fd8, transparent: true, opacity: 0.16 });
  return new THREE.LineLoop(geo, mat);
}

function createPlanetBody(def){
  const pivot = new THREE.Object3D();
  pivot.rotation.x = def.incl || 0;
  scene.add(pivot);

  if (def.orbit > 0) pivot.add(createOrbitRing(def.orbit));

  const holder = new THREE.Object3D();
  holder.position.x = def.orbit;
  pivot.add(holder);

  const tilt = new THREE.Object3D();
  tilt.rotation.z = def.tilt || 0;
  holder.add(tilt);

  const tex = TEXTURES[def.id];
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(def.radius, 48, 34),
    new THREE.MeshStandardMaterial({ map: tex.texture, roughness: 0.95, metalness: 0.0 })
  );
  tilt.add(mesh);
  previewSources[def.id] = tex.canvas;

  let ring = null;
  if (def.id === 'saturn'){
    const inner = def.radius * 1.42, outer = def.radius * 2.45;
    const rg = new THREE.RingGeometry(inner, outer, 128, 1);
    const pos = rg.attributes.position;
    const uv = rg.attributes.uv;
    const v3 = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++){
      v3.fromBufferAttribute(pos, i);
      const r = v3.length();
      uv.setXY(i, (r - inner) / (outer - inner), 0.5);
    }
    ring = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
      map: ringTexture(), transparent: true, side: THREE.DoubleSide,
      depthWrite: false, opacity: 0.95
    }));
    ring.rotation.x = -Math.PI / 2;
    tilt.add(ring);
  }

  let clouds = null;
  if (def.id === 'earth'){
    clouds = new THREE.Mesh(
      new THREE.SphereGeometry(def.radius * 1.016, 48, 34),
      new THREE.MeshStandardMaterial({
        map: cloudTexture(), transparent: true, opacity: 0.72,
        depthWrite: false, roughness: 1, metalness: 0
      })
    );
    tilt.add(clouds);
  }

  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(def.radius * 1.7, 2.4), 16, 12),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  hit.userData.id = def.id;
  tilt.add(hit);
  pickables.push(hit);

  const focusRing = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowSprite('rgba(120,255,235,0.85)', 'rgba(40,200,190,0.3)'),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0
  }));
  focusRing.scale.setScalar(def.radius * 4.2);
  tilt.add(focusRing);

  const body = {
    id: def.id, pivot, holder, tilt, mesh, clouds, ring, focusRing,
    radius: def.radius, orbit: def.orbit,
    angle: Math.random() * Math.PI * 2,
    speed: 0, baseSpeed: 0,
    spin: def.spin, isSun: false
  };

  if (def.parent){
    bodies[def.parent].holder.add(pivot);
  } else {
    bodies[def.id] = body;
  }
  return body;
}

/* ============================================================
   6. CAMERA CONTROLLER
   ============================================================ */
const cam = {
  target: new THREE.Vector3(0, 0, 0),
  goalTarget: new THREE.Vector3(0, 0, 0),
  radius: 158, goalRadius: 158,
  theta: 1.05, goalTheta: 1.05,
  phi: 0.92, goalPhi: 0.92,
  follow: null
};
const HOME = { radius: 158, theta: 1.05, phi: 0.92 };
const _v = new THREE.Vector3();

function goHome(){
  cam.follow = null;
  cam.goalTarget.set(0, 0, 0);
  cam.goalRadius = HOME.radius;
  cam.goalTheta = HOME.theta;
  cam.goalPhi = HOME.phi;
}
goHome();

function focusOn(id){
  const b = bodies[id];
  if (!b) return;

  let worldPos = new THREE.Vector3();
  if (b.isSprite) worldPos.copy(b.sprite.position);
  else if (b.holder) b.holder.getWorldPosition(worldPos);
  else return;

  cam.follow = id;
  cam.goalTarget.copy(worldPos);

  const r = b.radius;
  cam.goalRadius = clamp(r * 6.4 + 3.5, 8, 200);

  const dir = worldPos.clone().negate().normalize();
  if (dir.lengthSq() < 0.01) dir.set(0, 0.4, 1).normalize();
  cam.goalPhi = clamp(Math.acos(clamp(dir.y, -1, 1)), 0.35, 2.1);
  cam.goalTheta = Math.atan2(dir.z, dir.x);
}

function updateCamera(dt){
  if (cam.follow && bodies[cam.follow]){
    const b = bodies[cam.follow];
    if (b.isSprite) cam.goalTarget.copy(b.sprite.position);
    else if (b.holder) b.holder.getWorldPosition(_v) && cam.goalTarget.copy(_v);
  }

  const k = 1 - Math.exp(-dt * (REDUCED ? 16 : 5.2));
  cam.target.lerp(cam.goalTarget, k);

  let dTheta = cam.goalTheta - cam.theta;
  dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
  cam.theta += dTheta * k;
  cam.phi += (cam.goalPhi - cam.phi) * k;
  cam.radius += (cam.goalRadius - cam.radius) * k;

  const sp = Math.sin(cam.phi);
  camera.position.set(
    cam.target.x + cam.radius * sp * Math.cos(cam.theta),
    cam.target.y + cam.radius * Math.cos(cam.phi),
    cam.target.z + cam.radius * sp * Math.sin(cam.theta)
  );
  camera.lookAt(cam.target);
}

/* ---------- pointer / orbit controls ---------- */
let dragging = false, dragMoved = 0, lastX = 0, lastY = 0, downTime = 0;
let pointerNDC = new THREE.Vector2(-2, -2);
let hoveredId = null;
const raycaster = new THREE.Raycaster();

function canInteract(){
  return screen === 'space' && !anyModalOpen() && !questionOpen;
}

canvas.addEventListener('pointerdown', e => {
  if (!canInteract()) return;
  dragging = true; dragMoved = 0;
  lastX = e.clientX; lastY = e.clientY;
  downTime = performance.now();
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  updateHoverTip(e.clientX, e.clientY);

  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  if (dragMoved < 6) return;

  cam.follow = null;
  cam.goalTheta -= dx * 0.0055;
  cam.goalPhi = clamp(cam.goalPhi - dy * 0.0045, 0.22, 1.62);
});
canvas.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
  const quick = performance.now() - downTime < 520;
  if (dragMoved < 10 && quick) handleTap();
});
canvas.addEventListener('pointercancel', () => { dragging = false; });
canvas.addEventListener('wheel', e => {
  if (!canInteract()) return;
  e.preventDefault();
  cam.goalRadius = clamp(cam.goalRadius * (1 + Math.sign(e.deltaY) * 0.09), 7, 280);
}, { passive: false });

canvas.addEventListener('touchmove', e => { if (canInteract()) e.preventDefault(); }, { passive: false });

function handleTap(){
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (!hits.length) return;
  const id = hits[0].object.userData.id;
  if (!id) return;
  Sound.resume();
  if (isDiscovered(id)) openDiscoveryCard(id, { revisit: true });
  else openQuestion(id);
}

/* ---------- hover ---------- */
const tipEl = $('#hoverTip');
function updateHoverTip(x, y){
  if (!canInteract()){
    tipEl.classList.add('hidden');
    setHover(null);
    return;
  }
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  const id = hits.length ? hits[0].object.userData.id : null;
  setHover(id);
  if (id && !isDiscovered(id)){
    tipEl.classList.remove('hidden');
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
  } else {
    tipEl.classList.add('hidden');
  }
}
function setHover(id){
  if (hoveredId === id) return;
  hoveredId = id;
  canvas.style.cursor = id ? 'pointer' : 'grab';
  if (id) Sound.hover();
}

/* ============================================================
   7. GAME LOGIC — questions, scoring (+1 per correct), discovery
   ============================================================ */
const questionPanel = $('#questionPanel');
let questionOpen = false;
let activeQ = null;
let screen = 'welcome';
let modalOpen = false;
const anyModalOpen = () => modalOpen;

// === Simplified scoring: every correct answer is worth 1 point ===
const POINTS_PER_CORRECT = 1;

function addPoints(n){
  state.points += n;
  saveState();
  renderHUD();
}
function checkBadges(){
  const earned = [];
  BADGES.forEach(b => {
    if (!state.badges.includes(b.id) && b.check(state)){
      state.badges.push(b.id);
      earned.push(b);
    }
  });
  if (earned.length){
    saveState();
    earned.forEach((b, i) => setTimeout(() => {
      toast(`${b.icon} وسام جديد: ${b.name}!`);
      Sound.badge();
    }, 700 + i * 900));
  }
  return earned;
}

function renderHUD(){
  $('#pointsVal').textContent = state.points;
  const done = CORE_OBJECTS.filter(o => isDiscovered(o.id)).length;
  $('#discVal').textContent = `${done}/${CORE_OBJECTS.length}`;
}

/* ---------- QUESTION PANEL ---------- */
function openQuestion(id){
  const def = OBJ_BY_ID[id];
  if (!def) return;
  Sound.resume();

  const qIndex = def.questions.length > 1
    ? randInt(0, def.questions.length - 1)
    : 0;
  activeQ = {
    id,
    q: def.questions[qIndex],
    wrongCount: 0,
    hintUsed: false,
    locked: false
  };
  questionOpen = true;
  focusOn(id);
  renderQuestion();
  questionPanel.classList.remove('hidden');
}

function renderQuestion(feedbackHtml = ''){
  const q = activeQ.q;
  const letters = ['أ','ب','ج'];

  questionPanel.innerHTML = `
    <div class="q-obj"><span>🔭</span><span>جسم غامض يريد أن يعرّفك بنفسه</span></div>
    <p class="q-text" id="qText">${q.q}</p>
    <div class="q-options" id="qOptions">
      ${q.options.map((opt, i) => `
        <button class="opt-btn" data-i="${i}">
          <span class="opt-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>`).join('')}
    </div>
    ${feedbackHtml ? `<div class="q-feedback ${feedbackHtml.cls}">${feedbackHtml.txt}</div>` : ''}
    <div class="q-footer">
      <button class="btn-ghost gold" id="hintBtn">💡 أعطني تلميحاً</button>
      <button class="btn-ghost" id="closeQBtn">↩ العودة إلى الفضاء</button>
    </div>
  `;

  $$('#qOptions .opt-btn').forEach(btn => {
    btn.addEventListener('click', () => submitAnswer(Number(btn.dataset.i)));
  });
  $('#hintBtn').addEventListener('click', () => {
    if (activeQ.hintUsed || activeQ.locked) return;
    activeQ.hintUsed = true;
    Sound.click();
    renderQuestion({ cls:'bad', txt:`💡 ${activeQ.q.hint}` });
  });
  $('#closeQBtn').addEventListener('click', () => {
    Sound.click();
    closeQuestion();
    goHome();
  });

  if (activeQ.locked) lockOptions();
}

function lockOptions(){
  $$('#qOptions .opt-btn').forEach(b => b.disabled = true);
  const h = $('#hintBtn'); if (h) h.disabled = true;
}

function submitAnswer(i){
  if (activeQ.locked) return;
  const q = activeQ.q;
  const btns = $$('#qOptions .opt-btn');

  if (i === q.answer){
    activeQ.locked = true;
    btns[i].classList.add('correct');
    lockOptions();

    // === Every correct answer = +1 point ===
    const gained = POINTS_PER_CORRECT;
    awardDiscovery(activeQ.id, gained);

    const def = OBJ_BY_ID[activeQ.id];
    renderQuestion({ cls:'good', txt:`🎉 أحسنت! لقد اكتشفت ${def.name}! ${def.emoji}` });

    Sound.correct();
    setTimeout(() => Sound.discover(), 420);
    setTimeout(() => {
      closeQuestion();
      openDiscoveryCard(activeQ.id, { gained });
    }, 1150);

  } else {
    activeQ.wrongCount++;
    const btn = btns[i];
    btn.classList.add('wrong');
    Sound.wrong();
    setTimeout(() => btn.classList.remove('wrong'), 480);

    let msg = 'محاولة جميلة! لنفكر معاً. ';
    if (activeQ.wrongCount === 1){
      msg += 'اقرأ الوصف مرة أخرى بتمعّن، ثم جرّب من جديد!';
    } else if (activeQ.wrongCount === 2){
      activeQ.hintUsed = true;
      msg += `تلميح صغير: ${q.hint}`;
    } else if (activeQ.wrongCount === 3){
      msg += `تلميح آخر: ${q.hint}`;
    } else {
      msg += 'لا بأس! سأشير لك إلى الجواب الصحيح. هيا نتعلم معاً.';
      setTimeout(() => {
        const correct = $$('#qOptions .opt-btn')[q.answer];
        if (correct) correct.classList.add('reveal');
      }, 400);
    }
    renderQuestion({ cls:'bad', txt: `🤔 ${msg}` });
  }
}

function closeQuestion(){
  questionOpen = false;
  activeQ = null;
  questionPanel.classList.add('hidden');
  questionPanel.innerHTML = '';
}

/* ---------- AWARD + SAVE ---------- */
function awardDiscovery(id, gained){
  const already = isDiscovered(id);
  if (!already){
    state.discovered.push(id);
    state.discoveries[id] = { at: Date.now(), points: gained };
    state.correctAnswers++;
    addPoints(gained);
    burstParticles(id);
    checkBadges();
  }
  saveState();
  renderHUD();
}

/* ---------- 3D celebration particles ---------- */
const particleGroups = [];
function burstParticles(id){
  const b = bodies[id];
  if (!b) return;
  const origin = new THREE.Vector3();
  if (b.isSprite) origin.copy(b.sprite.position);
  else if (b.holder) b.holder.getWorldPosition(origin);
  else return;

  const N = REDUCED ? 24 : 90;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  const vel = [];
  for (let i = 0; i < N; i++){
    pos[i*3] = origin.x; pos[i*3+1] = origin.y; pos[i*3+2] = origin.z;
    const dir = new THREE.Vector3(rand(-1,1), rand(-1,1), rand(-1,1)).normalize();
    vel.push(dir.multiplyScalar(rand(2.5, 9)));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: 2.4, map: softDot(), color: 0xffe08a, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, opacity: 1
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particleGroups.push({ pts, vel, life: 0, max: 2.1, origin });
}

function updateParticles(dt){
  for (let i = particleGroups.length - 1; i >= 0; i--){
    const g = particleGroups[i];
    g.life += dt;
    const arr = g.pts.geometry.attributes.position.array;
    for (let j = 0; j < g.vel.length; j++){
      arr[j*3]   += g.vel[j].x * dt;
      arr[j*3+1] += g.vel[j].y * dt;
      arr[j*3+2] += g.vel[j].z * dt;
      g.vel[j].multiplyScalar(0.965);
    }
    g.pts.geometry.attributes.position.needsUpdate = true;
    g.pts.material.opacity = Math.max(0, 1 - g.life / g.max);
    if (g.life >= g.max){
      scene.remove(g.pts);
      g.pts.geometry.dispose();
      g.pts.material.dispose();
      particleGroups.splice(i, 1);
    }
  }
}

/* ============================================================
   8. SPHERE PREVIEW RENDERER (canvas 2D)
   ============================================================ */
const previewCache = new Map();
function getSourceData(id){
  const src = previewSources[id];
  if (!src) return null;
  if (!previewCache.has(id)){
    const ctx = src.getContext('2d');
    previewCache.set(id, { data: ctx.getImageData(0, 0, src.width, src.height).data, w: src.width, h: src.height });
  }
  return previewCache.get(id);
}

function renderSpherePreview(dst, id, rotY = 0){
  const size = dst.width;
  const dctx = dst.getContext('2d');
  dctx.clearRect(0, 0, size, size);
  const src = getSourceData(id);
  if (!src) return;

  const img = dctx.createImageData(size, size);
  const R = size / 2 - 1;
  const half = size / 2;
  const lx = -0.55, ly = -0.6, lz = 0.58;
  const ll = Math.hypot(lx, ly, lz);

  for (let y = 0; y < size; y++){
    for (let x = 0; x < size; x++){
      const nx = (x - half) / R;
      const ny = (y - half) / R;
      const d2 = nx*nx + ny*ny;
      const idx = (y*size + x) * 4;
      if (d2 > 1){ img.data[idx+3] = 0; continue; }

      const nz = Math.sqrt(1 - d2);
      let u = (Math.atan2(nx, nz) / (Math.PI*2)) + 0.5 + rotY;
      u = u - Math.floor(u);
      const v = 0.5 - Math.asin(ny) / Math.PI;
      const tx = Math.min(src.w - 1, (u * src.w) | 0);
      const ty = Math.min(src.h - 1, (v * src.h) | 0);
      const si = (ty * src.w + tx) * 4;

      const diff = Math.max(0.16, (nx*lx + ny*ly + nz*lz) / ll);
      const rim = Math.pow(1 - nz, 3.2) * 0.55;

      img.data[idx]   = Math.min(255, src.data[si]   * diff + rim * 90);
      img.data[idx+1] = Math.min(255, src.data[si+1] * diff + rim * 150);
      img.data[idx+2] = Math.min(255, src.data[si+2] * diff + rim * 220);
      img.data[idx+3] = 255;
    }
  }
  dctx.putImageData(img, 0, 0);
}

function renderSpecialPreview(dst, id){
  const ctx = dst.getContext('2d');
  const s = dst.width;
  ctx.clearRect(0, 0, s, s);
  if (id === 'stars'){
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.18, '#cdefff');
    g.addColorStop(0.45, 'rgba(110,190,255,0.5)');
    g.addColorStop(1, 'rgba(60,120,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s/2, s/2, s/2, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    [0, Math.PI/2].forEach(a => {
      ctx.save(); ctx.translate(s/2, s/2); ctx.rotate(a);
      const lg = ctx.createLinearGradient(-s/2, 0, s/2, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)');
      lg.addColorStop(0.5, 'rgba(255,255,255,0.9)');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.moveTo(-s/2, 0); ctx.lineTo(0, -s*0.03); ctx.lineTo(s/2, 0); ctx.lineTo(0, s*0.03); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
  } else {
    const cols = ['rgba(150,90,255,', 'rgba(230,90,200,', 'rgba(90,150,255,'];
    for (let i = 0; i < 34; i++){
      const x = rand(s*0.18, s*0.82), y = rand(s*0.18, s*0.82), r = rand(s*0.1, s*0.34);
      const c = pick(cols);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, c + '0.45)');
      g.addColorStop(1, c + '0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    }
    for (let i = 0; i < 90; i++){
      ctx.globalAlpha = rand(0.35, 1);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(rand(0, s), rand(0, s), rand(0.4, 1.5), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function makePreviewCanvas(id, size, rotY = 0){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const def = OBJ_BY_ID[id];
  if (def.kind === 'stars' || def.kind === 'nebula') renderSpecialPreview(c, id);
  else renderSpherePreview(c, id, rotY);
  return c;
}

/* ============================================================
   9. UI — DISCOVERY CARD
   ============================================================ */
function openDiscoveryCard(id, opts = {}){
  const def = OBJ_BY_ID[id];
  if (!def) return;
  modalOpen = true;
  Sound.resume();

  const gain = opts.gained ?? state.discoveries[id]?.points ?? 0;
  const isNew = !opts.revisit;

  const visual = document.createElement('div');
  visual.className = 'card-visual';
  const pc = document.createElement('canvas');
  pc.width = pc.height = 220;
  visual.appendChild(pc);
  const animate = def.kind !== 'stars' && def.kind !== 'nebula';

  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="overlay" id="cardOverlay">
      <div class="panel card" id="cardPanel">
        <div id="cardVisualSlot"></div>
        <h2 class="card-name">${def.emoji} ${def.name}</h2>
        <p class="card-desc">${def.desc}</p>
        <div class="card-facts">
          ${def.facts.map(f => `<div class="fact"><span class="fico">✨</span><span>${f}</span></div>`).join('')}
        </div>
        ${isNew ? `<div class="card-reward">⭐ +${gain} نقطة</div>` : ''}
        <div class="card-actions">
          <button class="btn-primary" id="moreBtn" style="padding:14px 30px;font-size:18px">اكتشف المزيد ✨</button>
          <button class="btn-ghost" id="backBtn">العودة إلى المجموعة الشمسية</button>
        </div>
      </div>
    </div>
  `;
  $('#cardVisualSlot').replaceWith(visual);
  visual.appendChild(pc);

  let raf = null, rot = 0, last = performance.now();
  if (animate && !REDUCED){
    const loop = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      rot += dt * 0.22;
      renderSpherePreview(pc, id, rot);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  } else {
    if (animate) renderSpherePreview(pc, id, 0);
    else renderSpecialPreview(pc, id);
  }

  const close = () => {
    if (raf) cancelAnimationFrame(raf);
    root.innerHTML = '';
    modalOpen = false;
    afterCardClosed();
  };
  $('#backBtn').addEventListener('click', () => { Sound.click(); close(); goHome(); });
  $('#moreBtn').addEventListener('click', () => {
    Sound.click();
    if (raf) cancelAnimationFrame(raf);
    root.innerHTML = '';
    modalOpen = false;
    const next = nextUndiscovered();
    if (next){ focusOn(next.id); toast(`🔭 ابحث عن: ${next.name}؟`); }
    else { goHome(); toast('🎉 لقد اكتشفت كل الأجرام!'); }
  });
  $('#cardOverlay').addEventListener('click', e => { if (e.target.id === 'cardOverlay') close(); });
}

function nextUndiscovered(){
  return OBJECTS.find(o => !isDiscovered(o.id)) || null;
}

function afterCardClosed(){
  renderHUD();
  if (coreDone() && !state.missionCompleteShown){
    state.missionCompleteShown = true;
    saveState();
    setTimeout(showMissionComplete, 700);
  }
}

  $('#collClose').addEventListener('click', () => { Sound.click(); close(); });

/* ============================================================

(function buildObsStars(){
  const host = $('#obsStars');
  const n = 130;
  let html = '';
  for (let i = 0; i < n; i++){
    const size = Math.random() * 2.6 + 0.9;

    html += `<span class="star-dot" style="
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      width:${size}px;height:${size}px;opacity:${op};
      animation-duration:${dur}s;animation-delay:${delay}s;
      box-shadow:0 0 ${size*3}px rgba(180,220,255,.85)"></span>`;
  }
  host.innerHTML = html;
})();

/* ============================================================
   17. RESIZE
   ============================================================ */
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   18. RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
const speedMul = REDUCED ? 0.35 : 1;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.06, clock.getDelta());
  elapsed += dt;

  OBJECTS.forEach(def => {
    const b = bodies[def.id];
    if (!b) return;
    if (b.baseSpeed){
      b.angle += b.baseSpeed * speedMul * dt;
      if (b.id === 'moon'){
        b.pivot.rotation.y = b.angle;
      } else if (b.pivot){
        b.pivot.rotation.y = b.angle;
      }
    }
    if (b.mesh && b.spin) b.mesh.rotation.y += b.spin * speedMul * dt;
    if (b.clouds) b.clouds.rotation.y += b.spin * 1.35 * speedMul * dt;
    if (b.corona){
      const p = 1 + Math.sin(elapsed * 0.8) * 0.035;
      b.corona.scale.setScalar(def.radius * 5.4 * p);
      b.halo.scale.setScalar(def.radius * 9 * (1 + Math.sin(elapsed * 0.5 + 1) * 0.02));
    }
  });

  if (bodies.nebula) bodies.nebula.sprite.material.rotation = Math.sin(elapsed * 0.05) * 0.12;

  if (!REDUCED){
    starfield.twinkles.material.opacity = 0.45 + Math.sin(elapsed * 1.6) * 0.28;
    starfield.stars.material.opacity = 0.88 + Math.sin(elapsed * 0.7) * 0.09;
  }

  Object.keys(bodies).forEach(id => {
    const b = bodies[id];
    if (b.focusRing){
      const target = (hoveredId === id || cam.follow === id) ? 0.85 : 0;
      b.focusRing.material.opacity += (target - b.focusRing.material.opacity) * 0.12;
      const sc = b.radius * 4.2 * (1 + Math.sin(elapsed * 3) * 0.05);
      b.focusRing.scale.setScalar(sc);
    }
    if (b.mesh && !b.isSun){
      const want = (hoveredId === id) ? 1.06 : 1.0;
      b.mesh.scale.lerp(new THREE.Vector3(want, want, want), 0.15);
    }
  });
  if (bodies.stars && bodies.stars.sprite){
    const s = hoveredId === 'stars' ? 1.15 : 1.0;
    const base = 26;
    bodies.stars.sprite.scale.setScalar(base * s * (1 + Math.sin(elapsed * 2.2) * 0.04));
  }
  if (bodies.nebula && bodies.nebula.sprite){
    const s = hoveredId === 'nebula' ? 1.08 : 1.0;
    bodies.nebula.sprite.scale.setScalar(76 * s);
  }

  shooting.update(dt);
  updateParticles(dt);
  updateCamera(dt);

  renderer.render(scene, camera);
}

renderHUD();
animate();
